name: Scraper Canary

# Runs the same web-scraping-based data sources the app depends on
# (AHMIA dark web search, Sherlock's site list, Company Registry's Canada
# scraper) against a real, known-good query, on a schedule. These sources
# have broken silently before when a site's markup changed underneath the
# parser (see the AHMIA anti-bot token fix) — this catches that within a
# week instead of via a bug report, by opening (or updating) a tracking
# issue when a check fails.

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper canary checks
        id: canary
        run: |
          set +e
          PYTHONPATH=. python -c "from app.cli import check_scrapers_cli; check_scrapers_cli()" > canary_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat canary_output.txt

      - name: Open or update a tracking issue on failure
        if: steps.canary.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('canary_output.txt', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // issues.create() 422s on a label that doesn't already exist —
            // GitHub never auto-creates one — so a repo without this label
            // pre-provisioned would silently drop every tracking issue.
            // Ensure it exists first; a 422 here just means it already does.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'scraper-canary',
                color: 'd73a4a',
                description: 'Automated scraper health-check failures',
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'scraper-canary',
            });
            const commentBody = `Still failing as of ${new Date().toISOString()} ([run](${runUrl})):\n\n\`\`\`\n${body}\n\`\`\``;
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: commentBody,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Scraper canary check failed',
                body: `A scheduled canary check found a scraping-based data source returning no results on a known-good query — usually a sign the site's markup changed. See \`app/utils/scraper_health.py\` for what's checked.\n\n([run](${runUrl}))\n\n\`\`\`\n${body}\n\`\`\``,
                labels: ['scraper-canary'],
              });
            }
